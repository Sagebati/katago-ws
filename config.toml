# katago-ws configuration.
#
# Loaded at startup (`muxa::app!()` names it after the crate): this file, or the
# one $KATAGO_WS_CONFIG points at, merged with `KATAGO_WS_*` environment
# variables (`__` = table nesting), e.g. KATAGO_WS_DIESEL__URL, KATAGO_WS_ENGINE__MODEL.
# Secrets (diesel.url, sentry.dsn) should come from the environment in
# production rather than being committed here.

# Run mode (muxa core): "development" or "production". Drives env-aware defaults
# like the Sentry environment + trace sample rate. Left unset here, so muxa
# deduces it from the build profile — a debug build (local dev) ⇒ development, a
# release build (the container) ⇒ production. Override with KATAGO_WS_ENV.
# env = "development"

[web]
host = "0.0.0.0"
port = 3000

[otel]
service_name = "katago-ws"
# OTLP/gRPC collector endpoint. Unset → export disabled (local dev needs no
# collector). Point it at your collector to ship traces/metrics/logs, e.g.
# KATAGO_WS_OTEL__ENDPOINT="http://otel-collector:4317".
# endpoint = "http://localhost:4317"
timeout_secs = 10
metric_interval_secs = 60

[sentry]
# Leave dsn empty for local dev → Sentry runs as a no-op client.
dsn = ""
# environment + traces_sample_rate are intentionally unset: muxa derives both
# from the run mode (see `env` above). development → environment "development",
# sample rate 1.0; production → "production", 0.1. Override either via
# KATAGO_WS_SENTRY__ENVIRONMENT / KATAGO_WS_SENTRY__TRACES_SAMPLE_RATE.
# logs: INFO/WARN/ERROR tracing events are also shipped to Sentry's Logs product
# (on by default once a DSN is set). Set logs = false to disable.
# logs = true

[diesel]
# Override with KATAGO_WS_DIESEL__URL in deployment.
url = "postgres://postgres:postgres@localhost:5432/goban"
max_connections = 10

# The single pgmq queue ("analysis") is declared in code (queue::Queue) — no
# [pgmq] section needed. The queue name is not configurable.

[engine]
# KataGo analysis engine. The service launches `katago analysis -config <config>
# -model <model>` as a long-lived subprocess and drives it over JSON. These are
# the local-dev paths (the container overrides them via KATAGO_WS_ENGINE__BINARY /
# KATAGO_WS_ENGINE__CONFIG / KATAGO_WS_ENGINE__MODEL).
binary = "katago"
config = "analysis.cfg"
model = "model.bin.gz"
# Analysis tuning (max_visits, analysis_pv_len, include_ownership, top_k,
# default_komi, default_board_size, request_timeout_secs) defaults to the values
# in `src/config.rs`; override any of them here or via KATAGO_WS_ENGINE__* env vars.
#
# Throughput (see README "Throughput tuning"). Passed to KataGo as
# `-override-config`; 0 / empty keeps analysis.cfg's value.
# analysis_threads = <system threads> # numAnalysisThreads: positions in parallel
# search_threads_per_analysis = 1     # numSearchThreadsPerAnalysisThread
# nn_max_batch_size = 0               # nnMaxBatchSize (per GPU)
# nn_server_threads = 0               # numNNServerThreadsPerModel (one per GPU)
# override_config = ""                # extra raw "key=value,key=value"
#
# Startup auto-tune (on by default): before launching KataGo, short trials pick
# nn_server_threads x nn_max_batch_size, analysis_threads and (OpenCL) the
# device — ROCm over Mesa rusticl when both expose the GPU — and cache the
# result, so later starts skip it. The four settings above are kept when set
# here or via env (as is any key in override_config); only the rest are tuned.
# Any failure falls back to the config as given.
# autotune = true                    # KATAGO_WS_ENGINE__AUTOTUNE=false disables it
# autotune_mode = "thorough"         # or "fast": under ~30 s, guided by GPU size + backend
# autotune_cache = ""                # "" = ~/.katago/katago-ws-autotune.json (next to opencltuning/)
# autotune_timeout_secs = 300        # incl. KataGo's first-use OpenCL kernel tuning
# One-shot, outside any role: `katago-ws autotune [--fast] [--force]`.
#
# Two-pass analysis: screen every move at screen_visits, re-search at max_visits
# only the moves whose screened win rate / score swings by a refine delta.
# 0 (default) = off: one pass at max_visits.
# screen_visits = 0
# refine_winrate_delta = 0.03
# refine_score_delta = 1.0

[api]
# Bearer secret for POST /analyse/batch, which is not IP rate-limited (it's for
# a backend submitting for many users). Empty = open to anyone, which also lets
# anyone skip the rate limit: set it on a public deployment once its clients
# send it. Via KATAGO_WS_API__CLIENT_TOKEN, never here.
# client_token = "…"

[ratelimit]
# Per-IP rate limit on POST /analyse, the public way to queue KataGo work
# (POST /analyse/batch is gated by [api].client_token, when set, instead).
# In-memory, per instance — a coarse abuse guard, not a global cap (each replica
# has its own buckets). GCRA quota: one submit allowance restored every
# `period_ms`, up to `burst` at once → here, 100 submits per IP per hour: one
# allowance restored every 36s (3_600_000 / 100), with up to 10 spendable at
# once as a burst.
enabled = true
period_ms = 36000
burst = 10
# Trust X-Forwarded-For / X-Real-IP for the client IP. Enable ONLY behind a proxy
# you control (otherwise clients spoof their IP). false → unspoofable peer IP
# (which behind a proxy is the proxy's IP = one shared bucket).
trust_forwarded_for = false

# Launch role is the first CLI argument (NOT config): `katago-ws [standalone|
# orchestrator|worker]`, default `standalone`. `standalone` = web + in-process
# workers (one process). `orchestrator` = web + pgmq + the cluster WebSocket
# dispatcher (served at `/cluster` on the web port; no engine). `worker` = KataGo +
# WebSocket client dialing the orchestrator (no Postgres); serves /healthz only.

[worker]
# Consumer lease loops (standalone/orchestrator) AND the slots a worker advertises:
# games in flight per engine. A few keep KataGo's queue from draining.
concurrency = 4
# Visibility timeout while a job is in flight (the worker heartbeats to extend
# it). Below the config.rs default of 600 — the heartbeat re-arms it as needed.
visibility_timeout_secs = 120
# poll_secs and max_attempts default per src/config.rs.
# `worker` role only — the orchestrator's cluster WebSocket URL to dial, the secret
# it presents (must equal the orchestrator's auth_token), and the reconnect backoff.
# Override via KATAGO_WS_WORKER__ORCHESTRATOR_URL / KATAGO_WS_WORKER__AUTH_TOKEN.
orchestrator_url = "ws://tfskksv6ajdzz6nyml575ujx.54.36.100.240.sslip.io/cluster"
auth_token = ""
reconnect_backoff_secs = 3

[orchestrator]
# `orchestrator` role only — shared secret a worker must present (Bearer) to open
# the cluster WebSocket (served at `/cluster` on the web port). Empty = auth
# disabled (only safe on a trusted private network). ALWAYS set it (as a secret,
# via KATAGO_WS_ORCHESTRATOR__AUTH_TOKEN) when the socket is publicly reachable.
auth_token = ""
