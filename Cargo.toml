[package]
name = "katago-ws"
version = "0.1.0"
edition = "2024"
# Never publishable: path deps on unpublished sibling crates (muxa, pgmq).
# release-plz.toml also sets this per-package; this is belt-and-suspenders so
# a stray local `cargo publish` fails fast with a clear reason.
publish = false

[dependencies]
# muxa framework (local): web + diesel(async pg) + pgmq + otel + sentry + openapi
# + diesel-migrations (MigrationsRunner runs the embedded migrations at startup).
muxa = { path = "../muxa/crates/muxa", features = [
    "web", "ratelimit", "diesel", "diesel-migrations", "diesel-sentry", "pgmq", "sentry", "openapi",
    # OpenTelemetry: OTLP export over gRPC of traces (+ the tracing→OTel bridge),
    # metrics, and logs. Endpoint configured via `[otel].endpoint`.
    "otel", "otel-otlp-tonic", "otel-tracing-bridge", "otel-metrics", "otel-logs",
] }
# pgmq fork, the same git rev muxa pins (muxa's root Cargo.toml) so cargo
# unifies the two into one pgmq in the graph — bump both together. Used directly
# for the `Message`/`Queue` API in `queue.rs`; the `Queue` trait is gated behind
# `queue-experimental` upstream.
pgmq = { git = "https://github.com/Sagebati/pgmq", rev = "1ad05960c924c26a3c5d2269017ac10164482404", default-features = false, features = ["diesel-async", "queue-experimental"] }
# SGF parsing — used to build the KataGo move list + game metadata.
sgf-parse = "4.2"

# Orchestrator↔worker control plane over WebSocket (the `orchestrator` and
# `worker` roles; see `src/cluster/`). The orchestrator serves the socket on its
# existing axum web server (axum's `ws` feature); a worker dials it with
# `tokio-tungstenite` (rustls + bundled webpki roots, so `wss://` works behind a
# TLS-terminating reverse proxy with no system OpenSSL). `rustls` is a direct dep
# only to install a process-default crypto provider at worker startup.
# Pinned to 0.29 to match the version axum 0.8's `ws` feature pulls — otherwise the
# graph compiles two copies of tungstenite/tokio-tungstenite (a binary-size + build
# -time smell `cargo tree -d` flags).
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = "0.23"
futures-util = "0.3"
# Shared-secret auth token for the (now public) cluster socket — kept redacted.
secrecy = { version = "0.10", features = ["serde"] }

# OpenAPI: aide comes through `muxa::aide` (the facade re-export) — no direct
# dep. muxa-openapi enables the features we use (axum/axum-json/axum-query/macros),
# and the `OperationIo` derive resolves its `aide::` paths via `use muxa::aide`.
# schemars supplies the `JsonSchema` derive; async-stream powers the SSE handler.
schemars = { version = "1", features = ["derive"] }
async-stream = "0.3"

# Custom metrics (workers/jobs/duration) via the global meter that muxa-otel's
# `otel-metrics` installs. Pinned to muxa's opentelemetry line so the meter
# provider unifies. No collector configured ⇒ a no-op meter, so recording is
# a cheap no-op (nothing exported until `[otel].endpoint` is set).
opentelemetry = { version = "0.32", features = ["metrics"] }
# Sentry bridge for those same metrics: the `metrics` feature turns on the
# Sentry SDK's Application Metrics API (sentry::metrics::{counter,gauge,
# distribution}), which we dual-emit to alongside OTEL. Sentry does NOT ingest
# OTLP metrics, so this native SDK path is the only way to land them in Sentry —
# and it reuses the existing DSN (no collector). default-features=false: the
# transport/TLS features come unified from muxa-sentry's sentry dep.
sentry = { version = "0.48", default-features = false, features = ["metrics"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
# `Stream` trait for the SSE response type; `sync` adds `ReceiverStream`, used to
# bridge the orchestrator's per-worker job channel into the WebSocket writer.
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP client for the `healthcheck` probe (GET /healthz on localhost). Already in
# the graph through sentry's transport, so this adds no crates; default
# features off because the probe only speaks plain HTTP to 127.0.0.1.
reqwest = { version = "0.13", default-features = false }

diesel = { version = "2", default-features = false, features = ["postgres", "uuid", "chrono", "serde_json"] }
diesel-async = { version = "0.9", default-features = false, features = ["postgres", "deadpool"] }
# Maps the Postgres `job_status` enum to the Rust `JobStatus` enum (the `jobs`
# view exposes status as this enum, not text).
diesel-derive-enum = { version = "2", features = ["postgres"] }
# Needed directly because `embed_migrations!()` expands to `diesel_migrations::`
# paths in this crate; the version unifies with muxa-diesel's.
diesel_migrations = "2"

# Fast multithreaded allocator.
mimalloc = "0.1"

# Time-ordered (v7) job ids are minted by Postgres (the `uuidv7()` DEFAULT), so
# this crate is only needed for the `Uuid` type + serde — no client-side gen.
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"

# Command line: the role subcommand and the flags that override `[engine]` /
# `[worker]` keys (see `src/cli.rs`). Exact-pinned to 4.6.3, the last clap whose
# derive macro is on syn 2: from 4.6.4 it pulls syn 3, a second copy of the
# heaviest proc-macro dependency in the graph (`cargo tree -d`).
clap = { version = "=4.6.3", features = ["derive"] }
# The flags reach the config as one more figment layer, over the file and env
# muxa loads. Same 0.10 line as muxa-core, so it is one figment in the graph.
figment = { version = "0.10", default-features = false }

# Release profile. The crate had none → cargo defaults (no LTO, 16 codegen units,
# unstripped) produced a ~25 MB binary. The wins here are pure size/throughput with
# no behaviour change:
#   - `lto = "fat"`        cross-crate inlining + dead-code elimination across the
#                          (large) dep graph — the main shrink of the 13.5 MB `.text`.
#                          Use "thin" if CI build time matters more than the last MB.
#   - `codegen-units = 1`  lets the optimizer see the whole crate; smaller + faster.
#   - `strip = "debuginfo"` drops DWARF but KEEPS the symbol table, so panic/error
#                          backtraces stay symbolicated (the "tracerror" requirement).
#                          `strip = "symbols"` would save ~6 MB more but unsymbolicates
#                          local backtraces (fine only if Sentry has the debug files).
# `panic` is deliberately left at "unwind": a panicking task/request is isolated
# (axum catch-panic, pgmq redelivery) rather than aborting the process, and the
# Sentry panic hook still records it. "abort" would save ~2.5 MB of unwind tables
# but at the cost of that isolation.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"

# A curated subset of clippy's `restriction` group. The group as a whole is too
# noisy to enforce (clippy itself recommends enabling these individually), so we
# pick the genuinely useful ones. Only active under `cargo clippy`.
[lints.clippy]
# Panic safety (tests are exempted via clippy.toml's allow-unwrap-in-tests).
unwrap_used = "warn"
# No debug/placeholder leftovers; use `tracing`, not stdout/stderr.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
mem_forget = "warn"
# Small correctness wins.
lossy_float_literal = "warn"
fn_to_numeric_cast_any = "warn"
map_err_ignore = "warn"
# Clarity / consistency.
clone_on_ref_ptr = "warn"
str_to_string = "warn"
min_ident_chars = "warn"
unused_trait_names = "warn"
allow_attributes_without_reason = "warn"
# Nudge away from needless restricted visibility — prefer `pub` or private over a
# redundant `pub(crate)`.
redundant_pub_crate = "warn"
