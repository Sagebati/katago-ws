# katago-ws orchestrator for Coolify.
#
# Postgres is EXTERNAL (Supabase) — no DB service here. Coolify supplies the
# domain + Let's Encrypt TLS in front of port 3000; workers then dial
# wss://<your-domain>/cluster. See README.md for the Supabase URL + setup steps.
#
# In Coolify: create a "Docker Compose" resource from this file, set the
# environment variables below as Coolify secrets, and assign your domain to the
# `orchestrator` service on port 3000.
services:
  orchestrator:
    image: ghcr.io/sagebati/katago-ws:latest
    restart: unless-stopped
    environment:
      # Role selector (no CLI arg in a managed container → use the env var).
      KATAGO_WS_ROLE: orchestrator
      # Run mode (muxa core): drives env-aware defaults (Sentry environment +
      # trace sample rate). The release image already deduces "production" from
      # its build profile; set it explicitly here too so it's unambiguous.
      KATAGO_WS_ENV: production
      KATAGO_WS_WEB__HOST: "0.0.0.0"
      KATAGO_WS_WEB__PORT: "3000"
      KATAGO_WS_WEB__BANNER: "false"
      # Supabase connection string — use the SESSION-mode pooler (port 5432 on
      # …pooler.supabase.com): IPv4-friendly and safe for a persistent diesel
      # pool. Do NOT use the transaction pooler (6543) — it breaks prepared
      # statements. Set this as a Coolify SECRET, not in the file.
      KATAGO_WS_DIESEL__URL: ${KATAGO_WS_DIESEL__URL}
      # Shared secret a worker must present (Bearer) to open /cluster. Empty =
      # auth DISABLED, and this socket is PUBLIC on the internet — set it.
      KATAGO_WS_ORCHESTRATOR__AUTH_TOKEN: ${KATAGO_WS_ORCHESTRATOR__AUTH_TOKEN:-}
      # Sentry (error tracking). Empty DSN ⇒ no-op client, nothing sent — so this
      # is safe to leave blank. Set KATAGO_WS_SENTRY__DSN as a Coolify SECRET to enable.
      # The DSN is redacted in logs (SecretString). See README §6.
      #
      # With KATAGO_WS_ENV=production above, the Sentry environment defaults to
      # "production" and the transaction sample rate to 0.1 (10%) — no Sentry-
      # specific env needed. Override with KATAGO_WS_SENTRY__ENVIRONMENT /
      # KATAGO_WS_SENTRY__TRACES_SAMPLE_RATE (e.g. 1.0 = all requests, 0.0 = errors only).
      KATAGO_WS_SENTRY__DSN: ${KATAGO_WS_SENTRY__DSN:-}
      RUST_LOG: info
    expose:
      - "3000"
    # Health: the image's own HEALTHCHECK (`katago-ws healthcheck` → GET /healthz)
    # applies. Don't add a `healthcheck:` block with `disable: true` here — it
    # would switch the image's check off.
