# ── WORKER HOST ──────────────────────────────────────────────────────────────
# Runs on EACH worker machine: KataGo engine + cluster WebSocket client. No
# Postgres access. It dials the orchestrator and processes pushed jobs. Disposable
# — if it dies mid-job the orchestrator's pgmq lease lapses and the job is redelivered.
#
#   KATAGO_WS_IMAGE=registry.example.com/katago-ws:latest \
#   ORCHESTRATOR_HOST=10.0.0.5 \
#   CLUSTER_TOKEN=<same secret the orchestrator was given> \
#   docker compose -f worker.compose.yml up -d --scale worker=4
#
# `--scale worker=N` runs N engines on this host; or just run this file on more
# machines. Each worker advertises KATAGO_WS_WORKER__CONCURRENCY slots.
name: katago-ws-worker

services:
  worker:
    image: ${KATAGO_WS_IMAGE:?set KATAGO_WS_IMAGE}
    command: worker
    environment:
      # The orchestrator's `/cluster` WebSocket on its web port (:3000). Must be
      # reachable from here; nothing else (no DB). Use wss:// if it's behind TLS.
      KATAGO_WS_WORKER__ORCHESTRATOR_URL: "ws://${ORCHESTRATOR_HOST:?set ORCHESTRATOR_HOST}:3000/cluster"
      # Shared secret presented as a Bearer token — must equal the orchestrator's.
      KATAGO_WS_WORKER__AUTH_TOKEN: ${CLUSTER_TOKEN:?set CLUSTER_TOKEN (same secret as the orchestrator)}
      # Concurrent analyses this worker accepts (slots advertised to the orchestrator).
      KATAGO_WS_WORKER__CONCURRENCY: "2"
      KATAGO_WS_WORKER__RECONNECT_BACKOFF_SECS: "3"
      # Workers do the heavy lifting — tune analysis strength per host's CPU/GPU.
      KATAGO_WS_ENGINE__MAX_VISITS: "100"
      KATAGO_WS_ENGINE__REQUEST_TIMEOUT_SECS: "600"
      # GPU throughput is auto-tuned at startup: short trials pick
      # numNNServerThreadsPerModel x nnMaxBatchSize, numAnalysisThreads and (on
      # OpenCL) the device — ROCm over Mesa rusticl — and cache the result in
      # /home/app/.katago (the volume below; without it every start re-tunes,
      # plus KataGo's one-off OpenCL kernel tuning, cached there too). On an
      # RX 6800 XT (b10, 100 visits) it picks 4x64 for stock KataGo and 8x32 for
      # the patched build in patches/. Any of these set here is kept as given and
      # only the rest are tuned; AUTOTUNE=false skips it, AUTOTUNE_MODE=fast
      # trades exhaustiveness for a <30 s search.
      # KATAGO_WS_ENGINE__AUTOTUNE: "false"
      # KATAGO_WS_ENGINE__AUTOTUNE_MODE: "fast"
      # KATAGO_WS_ENGINE__ANALYSIS_THREADS: "256"
      # KATAGO_WS_ENGINE__NN_SERVER_THREADS: "4"
      # KATAGO_WS_ENGINE__NN_MAX_BATCH_SIZE: "64"
      # APPIMAGE_EXTRACT_AND_RUN=1 is baked into the image (the bundled KataGo is
      # an AppImage and the slim runtime has no FUSE), so no need to set it here.
      RUST_LOG: info
    restart: unless-stopped
    # KataGo's OpenCL kernel tuning + the auto-tune cache survive restarts.
    # Replicas share it; with --scale N on ONE GPU, start one first so the rest
    # hit the cache instead of tuning on the GPU at the same time.
    volumes:
      - katago-tuning:/home/app/.katago
    # No published ports — the worker dials OUT. It serves /healthz on 3000
    # internally; uncomment to expose a liveness probe:
    # ports: ["3000:3000"]

volumes:
  katago-tuning:
