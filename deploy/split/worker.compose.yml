# ── WORKER HOST ──────────────────────────────────────────────────────────────
# Runs on EACH worker machine: katago-rs engine + cluster WebSocket client. No
# Postgres access. It dials the orchestrator and processes pushed jobs. Disposable
# — if it dies mid-job the orchestrator's pgmq lease lapses and the job is redelivered.
#
#   KATAGO_WS_IMAGE=ghcr.io/sagebati/katago-ws:rocm \
#   ORCHESTRATOR_HOST=10.0.0.5 \
#   CLUSTER_TOKEN=<same secret the orchestrator was given> \
#   docker compose -f worker.compose.yml up -d --scale worker=4
#
# `--scale worker=N` runs N engines on this host; or just run this file on more
# machines. Each worker advertises KATAGO_WS_WORKER__CONCURRENCY slots. One
# engine saturates one GPU (an RX 6800 XT runs b18c384nbt at ~13 positions/s
# at 100 visits), so N > 1 is for several GPUs or for the CPU image.
#
# Images: `:cpu` (flex, b10c128), `:vulkan` (wgpu, b18c384nbt, f16: AMD/Intel
# through Mesa, NVIDIA through its own Vulkan driver), `:rocm` (HIP, b18c384nbt,
# f16). The GPU images need the GPU passed in: see `devices` below.
name: katago-ws-worker

services:
  worker:
    image: ${KATAGO_WS_IMAGE:?set KATAGO_WS_IMAGE}
    command: worker
    environment:
      # The orchestrator's `/cluster` WebSocket on its web port (:3000). Must be
      # reachable from here; nothing else (no DB). Use wss:// if it's behind TLS.
      KATAGO_WS_WORKER__ORCHESTRATOR_URL: "ws://${ORCHESTRATOR_HOST:?set ORCHESTRATOR_HOST}:3000/cluster"
      # Shared secret presented as a Bearer token — must equal the orchestrator's.
      KATAGO_WS_WORKER__AUTH_TOKEN: ${CLUSTER_TOKEN:?set CLUSTER_TOKEN (same secret as the orchestrator)}
      # Concurrent analyses this worker accepts (slots advertised to the orchestrator).
      KATAGO_WS_WORKER__CONCURRENCY: "2"
      KATAGO_WS_WORKER__RECONNECT_BACKOFF_SECS: "3"
      # Workers do the heavy lifting — tune analysis strength per host's CPU/GPU.
      KATAGO_WS_ENGINE__MAX_VISITS: "100"
      KATAGO_WS_ENGINE__REQUEST_TIMEOUT_SECS: "600"
      # GPU throughput is auto-tuned at startup: short trials pick
      # numNNServerThreadsPerModel x nnMaxBatchSize and numAnalysisThreads, and
      # cache the result in /home/app/.katago (the volume below; without it every
      # start re-tunes). On an RX 6800 XT (ROCm, b18c384nbt, 100 visits) it picks
      # 8x64 with 256 analysis threads. Any of these set here is kept as given
      # and only the rest are tuned; AUTOTUNE=false skips it, AUTOTUNE_MODE=fast
      # trades exhaustiveness for a <30 s search. The cpu image skips it.
      # KATAGO_WS_ENGINE__AUTOTUNE: "false"
      # KATAGO_WS_ENGINE__AUTOTUNE_MODE: "fast"
      # KATAGO_WS_ENGINE__ANALYSIS_THREADS: "256"
      # KATAGO_WS_ENGINE__NN_SERVER_THREADS: "4"
      # KATAGO_WS_ENGINE__NN_MAX_BATCH_SIZE: "64"
      RUST_LOG: info
    restart: unless-stopped
    # rocm: the HIP devices, and the host's video/render groups (numeric GIDs
    # from `getent group video render`; they differ between distros).
    # devices: ["/dev/kfd", "/dev/dri"]
    # group_add: ["video", "render"]
    # vulkan on AMD/Intel: devices: ["/dev/dri"] and the render group. On
    # NVIDIA: the NVIDIA Container Toolkit, with
    # deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu, graphics] }] } } }
    # The auto-tune cache survives restarts. Replicas share it; with --scale N on
    # ONE GPU, start one first so the rest hit the cache instead of tuning on the
    # GPU at the same time.
    volumes:
      - katago-tuning:/home/app/.katago
    # No published ports — the worker dials OUT. It serves /healthz on 3000
    # internally; uncomment to expose a liveness probe:
    # ports: ["3000:3000"]

volumes:
  katago-tuning:
