# Build the katago-ws images and push them to GitHub Container Registry (ghcr.io),
# so a host can pull a ready image instead of building the Dockerfile itself —
# which it can't, because the build needs the sibling `katago-rs` (the engine),
# `muxa` + `pgmq` repos as a PARENT context (a one-repo clone doesn't have them).
#
# One Dockerfile, three katago-rs builds — a matrix, one image per backend,
# derived from `just print-matrix` (the justfile is the single source of truth
# for the variants; see also .github/workflows/release.yml, which reuses the
# same matrix for tag-triggered versioned releases):
#
#   :cpu     burn flex  — pure CPU, no GPU, b10c128       (also tagged :latest)
#   :vulkan  wgpu       — any GPU with a Vulkan driver, b18c384nbt
#   :rocm    HIP        — AMD GPUs (--device /dev/kfd --device /dev/dri), b18c384nbt
#
# Each is also tagged :<variant>-<commit-sha>. The CPU image is :latest because
# it runs anywhere (no GPU runtime required). This workflow only handles the
# rolling main-push path; versioned (:variant-vX.Y.Z) images + the binary
# release come from release.yml on a `v*.*.*` tag push. A manual run on another
# branch pushes only :<variant>-<commit-sha>, never the rolling tags.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout katago-ws
        uses: actions/checkout@v7
        with:
          path: katago-ws

      - uses: extractions/setup-just@v4

      - name: Emit build matrix from the justfile
        id: matrix
        working-directory: katago-ws
        run: |
          json="$(just print-matrix)"
          echo "matrix=$(echo "$json" | jq -c '{include}')" >> "$GITHUB_OUTPUT"

  build-push:
    needs: matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      # Don't cancel the other backends if one fails to build.
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - name: Free runner disk (image builds katago-rs and two release binaries)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Checkout katago-ws
        uses: actions/checkout@v7
        with:
          path: katago-ws

      - name: Checkout siblings (katago-rs, muxa, pgmq)
        uses: ./katago-ws/.github/actions/checkout-siblings
        with:
          katago-rs-ssh-key: ${{ secrets.KATAGO_RS_DEPLOY_KEY }}

      - name: Scope the Docker build context
        run: |
          cat > "$GITHUB_WORKSPACE/.dockerignore" <<'EOF'
          **/.git
          **/target
          **/node_modules
          **/.idea
          EOF

      - name: Set up Buildx (gha layer cache needs the container driver)
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The rolling tags only from main: Coolify's orchestrator pulls :latest.
      - name: Compose image tags (:<variant>-<sha>; from main also :<variant>, cpu :latest)
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/sagebati/katago-ws:${{ matrix.variant }}-${{ github.sha }}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "ghcr.io/sagebati/katago-ws:${{ matrix.variant }}"
              if [ "${{ matrix.variant }}" = "cpu" ]; then
                echo "ghcr.io/sagebati/katago-ws:latest"
              fi
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build + push ${{ matrix.variant }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: katago-ws/Dockerfile
          target: runtime
          push: true
          build-args: |
            RUNTIME_BASE=${{ matrix.base }}
            RUNTIME_PKGS=${{ matrix.pkgs }}
            RUNTIME_APT_GPG_URL=${{ matrix.key_url }}
            RUNTIME_APT_REPO=${{ matrix.repo }}
            ENGINE_FEATURES=${{ matrix.features }}
            ENGINE_BACKEND=${{ matrix.backend }}
            ENGINE_FP16=${{ matrix.fp16 }}
            ENGINE_MODEL=${{ matrix.model }}
          tags: ${{ steps.tags.outputs.tags }}
          # Per-variant scope: the heavy (and identical) Rust builder stage is
          # reused run-over-run without the three concurrent jobs racing on one
          # cache key.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
