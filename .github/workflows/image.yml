# Build the katago-ws images and push them to GitHub Container Registry (ghcr.io),
# so a host can pull a ready image instead of building the Dockerfile itself —
# which it can't, because the build needs the sibling `muxa` + `pgmq` crates as a
# PARENT context (a one-repo clone doesn't have them).
#
# One Dockerfile, three KataGo binaries — built as a matrix, one image per
# backend, derived from `just print-matrix` (the justfile is the single source
# of truth for the variant trios; see also .github/workflows/release.yml, which
# reuses the same matrix for tag-triggered versioned releases):
#
#   :cpu     Eigen     — pure CPU, no GPU            (also tagged :latest)
#   :cuda    CUDA      — NVIDIA GPU (needs --gpus)
#   :opencl  OpenCL    — AMD/Intel GPU (--device /dev/dri)
#
# Each is also tagged :<variant>-<commit-sha>. The CPU image is :latest because
# it runs anywhere (no GPU runtime required). This workflow only handles the
# rolling main-push path; versioned (:variant-vX.Y.Z) images + the binary
# release come from release.yml on a `v*.*.*` tag push.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      katago_version: ${{ steps.matrix.outputs.katago_version }}
    steps:
      - name: Checkout katago-ws
        uses: actions/checkout@v4
        with:
          path: katago-ws

      - uses: extractions/setup-just@v3

      - name: Emit build matrix from the justfile
        id: matrix
        working-directory: katago-ws
        run: |
          json="$(just print-matrix)"
          echo "matrix=$(echo "$json" | jq -c '{include}')" >> "$GITHUB_OUTPUT"
          echo "katago_version=$(echo "$json" | jq -r '.katago_version')" >> "$GITHUB_OUTPUT"

  build-push:
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Don't cancel the other backends if one fails to build.
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - name: Free runner disk (image bundles KataGo + a model + a release build)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Checkout katago-ws
        uses: actions/checkout@v4
        with:
          path: katago-ws

      - name: Checkout siblings (muxa, pgmq)
        uses: ./katago-ws/.github/actions/checkout-siblings

      - name: Scope the Docker build context
        run: |
          cat > "$GITHUB_WORKSPACE/.dockerignore" <<'EOF'
          **/.git
          **/target
          **/node_modules
          **/.wrangler
          **/.idea
          EOF

      - name: Set up Buildx (gha layer cache needs the container driver)
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose image tags (always :<variant> + :<variant>-<sha>; cpu also :latest)
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/sagebati/katago-ws:${{ matrix.variant }}"
            echo "ghcr.io/sagebati/katago-ws:${{ matrix.variant }}-${{ github.sha }}"
            if [ "${{ matrix.variant }}" = "cpu" ]; then
              echo "ghcr.io/sagebati/katago-ws:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build + push ${{ matrix.variant }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: katago-ws/Dockerfile
          target: runtime
          push: true
          build-args: |
            RUNTIME_BASE=${{ matrix.base }}
            KATAGO_VERSION=${{ needs.matrix.outputs.katago_version }}
            KATAGO_ZIP=${{ matrix.zip }}
            RUNTIME_PKGS=${{ matrix.pkgs }}
            RUSTICL_DRIVERS=${{ matrix.rusticl }}
          tags: ${{ steps.tags.outputs.tags }}
          # Per-variant scope: the heavy (and identical) Rust builder stage is
          # reused run-over-run without the three concurrent jobs racing on one
          # cache key.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
