# Advisory Conventional-Commits check on PR titles. release-plz's version-bump
# logic reads Conventional Commits, and under squash-merge the PR title becomes
# the commit message it parses. Non-blocking for now (continue-on-error) since
# the existing history predates this convention; flip to required once
# contributors have adjusted.
name: pr-title-lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
