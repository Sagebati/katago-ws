name: checkout-siblings
description: >
  Checks out the sibling muxa/pgmq repos this crate path-depends on, at the
  refs pinned in sibling-refs.env, into ./muxa and ./pgmq relative to the
  workspace root. Run this *after* checking out katago-ws itself (that first
  checkout can't be wrapped here, since this action lives inside it).

runs:
  using: composite
  steps:
    - name: Load pinned sibling refs
      shell: bash
      # $GITHUB_ENV is a `KEY=value` env file, not a shell dotenv — it has no
      # comment syntax, so sibling-refs.env's leading `#` lines (and any blank
      # lines) must be stripped before appending, or the runner rejects the
      # whole file with "Invalid format".
      # $GITHUB_ACTION_PATH, not ${{ github.action_path }}: inside a job
      # `container:` the expression still yields the host path
      # (/home/runner/work/...), while the env var is mapped to the
      # container's (/__w/...).
      run: grep -v '^\s*#' "$GITHUB_ACTION_PATH/../../sibling-refs.env" | grep -v '^\s*$' >> "$GITHUB_ENV"

    - name: Checkout muxa (sibling build-context crate, pinned)
      uses: actions/checkout@v7
      with:
        repository: ${{ env.MUXA_REPO }}
        ref: ${{ env.MUXA_REF }}
        path: muxa

    - name: Checkout pgmq fork (sibling build-context crate, pinned)
      uses: actions/checkout@v7
      with:
        repository: ${{ env.PGMQ_REPO }}
        ref: ${{ env.PGMQ_REF }}
        path: pgmq
