name: checkout-siblings
description: >
  Checks out the engine, katago-rs, at the ref pinned in sibling-refs.env, into
  ./katago-rs relative to the workspace root (the image builds compile it).
  Run this *after* checking out katago-ws itself (that first checkout can't be
  wrapped here, since this action lives inside it).

runs:
  using: composite
  steps:
    - name: Load pinned sibling refs
      shell: bash
      # $GITHUB_ENV is a `KEY=value` env file, not a shell dotenv — it has no
      # comment syntax, so sibling-refs.env's leading `#` lines (and any blank
      # lines) must be stripped before appending, or the runner rejects the
      # whole file with "Invalid format".
      # $GITHUB_ACTION_PATH, not ${{ github.action_path }}: inside a job
      # `container:` the expression still yields the host path
      # (/home/runner/work/...), while the env var is mapped to the
      # container's (/__w/...).
      run: grep -v '^\s*#' "$GITHUB_ACTION_PATH/../../sibling-refs.env" | grep -v '^\s*$' >> "$GITHUB_ENV"

    # Without submodules: the image builds don't read katago-rs's upstream/.
    - name: Checkout katago-rs (the engine, pinned)
      uses: actions/checkout@v7
      with:
        repository: ${{ env.KATAGO_RS_REPO }}
        ref: ${{ env.KATAGO_RS_REF }}
        path: katago-rs
