# One-command deploy: `docker compose up --build` (from this directory).
# Brings up Postgres + the analyser. The default (cpu) image bundles katago-rs
# on its CPU backend with the b10c128 net, so no GPU is required.
name: katago-ws

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goban
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goban"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      # Parent dir so the sibling katago-rs checkout is in the build context.
      context: ..
      dockerfile: katago-ws/Dockerfile
      # `runtime` is the Dockerfile's last (default) stage, so this is
      # belt-and-suspenders — named explicitly so a future stage reorder can't
      # silently change what this builds.
      target: runtime
    environment:
      KATAGO_WS_DIESEL__URL: postgres://postgres:postgres@db:5432/goban
      RUST_LOG: info
      # Tune analysis strength/cost. Lowered to 10 so a full ~325-move game
      # completes well within the 600s engine timeout on the CPU backend. Raise (and bump KATAGO_WS_ENGINE__REQUEST_TIMEOUT_SECS) for
      # stronger analysis.
      KATAGO_WS_ENGINE__MAX_VISITS: "10"
      # KATAGO_WS_WORKER__CONCURRENCY: "2"
      # Error tracking (optional):
      # KATAGO_WS_SENTRY__DSN: "https://...@sentry.io/..."
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # Split deployment on a SINGLE host (one orchestrator + N workers on the same
  # compose network — workers reach it via compose DNS `ws://orchestrator:3000/cluster`).
  # For orchestrator and workers on SEPARATE MACHINES, use deploy/split/ instead
  # (per-machine compose files + the network/security notes). Same image, the
  # role is just the first CLI arg (the `command:`).
  # ───────────────────────────────────────────────────────────────────────────
  # orchestrator:
  #   build:
  #     context: ..
  #     dockerfile: katago-ws/Dockerfile
  #     target: runtime
  #   command: orchestrator            # role (appended to the ENTRYPOINT)
  #   environment:
  #     KATAGO_WS_DIESEL__URL: postgres://postgres:postgres@db:5432/goban
  #     # The cluster socket is served at /cluster on the web port (3000) — no extra
  #     # port. Auth is disabled here (private compose network); set
  #     # KATAGO_WS_ORCHESTRATOR__AUTH_TOKEN (+ the worker's KATAGO_WS_WORKER__AUTH_TOKEN) to
  #     # require a shared Bearer secret.
  #     RUST_LOG: info
  #   ports:
  #     - "3000:3000"                  # public API
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   restart: unless-stopped
  #
  # worker:
  #   build:
  #     context: ..
  #     dockerfile: katago-ws/Dockerfile
  #     target: runtime
  #   command: worker
  #   environment:
  #     # No KATAGO_WS_DIESEL__URL — workers never reach Postgres; they only dial the
  #     # orchestrator's /cluster WebSocket (service name resolves on the compose network).
  #     KATAGO_WS_WORKER__ORCHESTRATOR_URL: "ws://orchestrator:3000/cluster"
  #     KATAGO_WS_ENGINE__MAX_VISITS: "10"
  #     RUST_LOG: info
  #   depends_on:
  #     - orchestrator
  #   restart: unless-stopped

volumes:
  pgdata:
